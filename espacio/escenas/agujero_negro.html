<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>agujero negro a fondo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@1,500&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#020202}
  #gl{position:absolute;left:0;top:0;width:1080px;height:1920px;display:block}
  .layer{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}

  /* Headline: caps-top ≈ 261, caja azul 250–319 */
  #headline{position:absolute;left:0;top:236px;width:1080px;padding-top:14px;text-align:center;
    font:700 64px/69px 'Inter',sans-serif;letter-spacing:-0.5px;color:#fff;white-space:pre}
  #headline .ch{visibility:hidden;color:#1f1f1f}
  #headline .ch.on{visibility:visible}
  #kw{display:inline-block;vertical-align:top;height:69px;line-height:69px;padding:0 10px;
    border-radius:8px;background:#2B5BE6;transform-origin:50% 50%;visibility:hidden}
  #kw .ch{color:#fff}

  /* Banda + etiqueta inferior */
  #band{position:absolute;left:0;top:1420px;width:1080px;height:140px;
    background:linear-gradient(to bottom,rgba(0,0,0,0) 0%,rgba(0,0,0,.55) 28%,rgba(0,0,0,.55) 72%,rgba(0,0,0,0) 100%)}
  #lt{position:absolute;left:0;top:1442px;width:1080px;text-align:center;
    font:700 40px/48px 'Inter',sans-serif;color:#fff;letter-spacing:-0.3px}
  #ls{position:absolute;left:0;top:1488px;width:1080px;text-align:center;
    font:italic 500 40px/48px 'Cormorant Garamond',serif;color:#b9b9b9}

  /* Callouts */
  .card{position:absolute;left:600px;width:420px;height:108px;box-sizing:border-box;padding:0 16px 0 18px;
    background:#fff;border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.55),0 3px 8px rgba(0,0,0,.35);
    display:flex;flex-direction:column;justify-content:center;white-space:nowrap;opacity:0}
  .ct{font:700 34px/40px 'Inter',sans-serif;color:#111;letter-spacing:-0.3px}
  .cs{font:400 30px/36px 'JetBrains Mono',monospace;color:#444;letter-spacing:-0.4px}
  .dot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#FF5A36;
    box-shadow:0 0 10px 3px rgba(255,90,54,.85),0 0 26px 8px rgba(255,90,54,.35);opacity:0}
  #lines line{stroke:#d9d9d9;stroke-width:2;stroke-linecap:round}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl" width="1080" height="1920"></canvas>

<div class="layer" id="overlay">
  <div id="headline"></div>

  <svg id="lines" class="layer" width="1080" height="1920" viewBox="0 0 1080 1920">
    <line id="l0"/><line id="l1"/><line id="l2"/>
  </svg>
  <div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div>

  <div class="card" id="c0" style="top:1170px"><div class="ct">Disco de acreción</div><div class="cs">gas que gira y cae</div></div>
  <div class="card" id="c1" style="top:810px"><div class="ct">Horizonte de sucesos</div><div class="cs">punto sin retorno</div></div>
  <div class="card" id="c2" style="top:985px"><div class="ct">Singularidad</div><div class="cs">el centro aplastado</div></div>

  <div id="band"></div>
  <div id="lt">agujero negro a fondo</div>
  <div id="ls">con Claude Code</div>
</div>

<script type="module">
import * as THREE from 'three';

const DURATION = 2.6;
window.DURATION = DURATION;
window.sceneReady = false;

/* ---------- utilidades deterministas ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand = mulberry32(20261114);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const easeOutCubic=x=>1-Math.pow(1-x,3);
const easeInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;

/* ---------- renderer / cámara ---------- */
const W=1080,H=1920;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
renderer.setSize(W,H,false);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.setClearColor(0x020202,1);

const scene=new THREE.Scene();
// Vista completa 1120x2000 centrada en el origen; la sub-vista 1080x1920 desplazada 40px deja el origen en (520,1000).
const FOV=30, F=1000/Math.tan(THREE.MathUtils.degToRad(FOV/2)); // a distancia F, 1 unidad = 1 px
const camera=new THREE.PerspectiveCamera(FOV,1120/2000,10,40000);
camera.setViewOffset(1120,2000,40,0,W,H);
camera.position.set(0,0,F);
camera.lookAt(0,0,0);

/* ---------- estrellas tenues ---------- */
{
  const N=520, pos=new Float32Array(N*3), col=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    pos[i*3]=(rand()*2-1)*2500; pos[i*3+1]=(rand()*2-1)*2300; pos[i*3+2]=-4000;
    const b=0.10+Math.pow(rand(),3)*0.45, w=rand();
    col[i*3]=b; col[i*3+1]=b*(0.92+0.08*w); col[i*3+2]=b*(0.85+0.2*w);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const m=new THREE.PointsMaterial({size:2.2,sizeAttenuation:false,vertexColors:true,transparent:true,
    blending:THREE.AdditiveBlending,depthWrite:false});
  const stars=new THREE.Points(g,m); stars.renderOrder=0;
  scene.add(stars);
}

/* ---------- disco de acreción (pasa POR DETRÁS de la esfera) ---------- */
const RIN=270, ROUT=1300, INCL=78;
const NOISE=`
float hash(vec3 p){p=fract(p*0.3183099+vec3(0.71,0.113,0.419));p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vnoise(vec3 x){vec3 i=floor(x);vec3 f=fract(x);f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash(i+vec3(0,0,0)),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=0.5,s=0.0;for(int i=0;i<4;i++){s+=a*vnoise(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=0.5;}return s;}
`;
const diskMat=new THREE.ShaderMaterial({
  uniforms:{uT:{value:0},uRin:{value:RIN},uRout:{value:ROUT}},
  vertexShader:`varying vec2 vP;void main(){vP=position.xy;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
  precision highp float;
  varying vec2 vP; uniform float uT,uRin,uRout;
  ${NOISE}
  void main(){
    float r=length(vP);
    float s=clamp((r-uRin)/(uRout-uRin),0.0,1.0);
    float phi=atan(vP.y,vP.x);
    float lr=log(r/uRin);
    // rotación diferencial (Kepler): adentro gira más rápido; leve torsión en espiral
    float a=phi+2.3*pow(uRin/r,1.5)*uT+0.35*lr;
    float ca=cos(a), sa=sin(a);
    // filamentos: muy finos en radio, largos en ángulo → rayas tipo motion blur
    float st =fbm(vec3(ca*2.2,sa*2.2,lr*46.0));
    float st2=vnoise(vec3(cos(a+0.9)*4.5,sin(a+0.9)*4.5,lr*95.0+7.0));
    // segmentación a lo largo de la órbita (rompe cualquier anillo continuo) + turbulencia animada
    float seg=fbm(vec3(ca*1.4+uT*0.18,sa*1.4,lr*6.0+3.0+uT*0.25));
    float seg2=vnoise(vec3(ca*3.2,sa*3.2-uT*0.3,lr*14.0));
    float streak=smoothstep(0.30,0.78,st*0.72+st2*0.42);
    float fil=streak*smoothstep(0.22,0.70,seg*0.8+seg2*0.35)*2.1;
    float I=0.22+fil;
    float radial=exp(-s*1.7)*1.45;
    float rim=exp(-s*30.0)*1.8;
    float edgeIn=smoothstep(0.0,0.015,s);
    float edgeOut=1.0-smoothstep(0.42,1.0,s);   // se desvanece a 0 en el radio exterior
    // Doppler: el lado que se acerca (derecha) brilla más, el que se aleja se apaga
    float dop=pow(1.0+0.42*cos(phi),1.9);
    vec3 cW=vec3(1.0,0.953,0.863), cP=vec3(1.0,0.690,0.439), cO=vec3(1.0,0.353,0.078);
    vec3 col=mix(cW,cP,smoothstep(0.0,0.06,s));
    col=mix(col,cO,smoothstep(0.06,0.30,s));
    float k=(I*radial*1.25+rim*(0.6+0.6*streak))*dop*edgeIn*edgeOut;
    // AdditiveBlending de three multiplica por alpha: alpha=1 y el desvanecido va en k
    gl_FragColor=vec4(col*k,1.0);
  }`,
  transparent:true,depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide
});
const disk=new THREE.Mesh(new THREE.RingGeometry(RIN,ROUT,360,64),diskMat);
disk.rotation.x=-THREE.MathUtils.degToRad(INCL); // local +y = lado lejano (arriba en pantalla)
disk.renderOrder=2;
scene.add(disk);

/* ---------- anillo de fotones (lente falsa), concéntrico con la esfera ---------- */
const RC=330, RING_UP=10;
const ringMat=new THREE.ShaderMaterial({
  uniforms:{uI:{value:1},uRc:{value:RC}},
  vertexShader:`varying vec2 vP;void main(){vP=position.xy;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
  precision highp float;
  varying vec2 vP; uniform float uI,uRc;
  void main(){
    float r=length(vP);
    float d=abs(r-uRc);
    float band=1.0-smoothstep(28.0,38.0,d);          // ~70 px de grosor
    float core=exp(-d*d/(2.0*13.0*13.0));
    float glow=exp(-d/55.0);
    float phi=atan(vP.y,vP.x);
    float dop=0.88+0.12*cos(phi);
    float a=(band*(0.72+0.28*core)*0.85+glow*0.26)*uI*dop;
    a*=smoothstep(200.0,250.0,r)*(1.0-smoothstep(470.0,520.0,r));
    gl_FragColor=vec4(vec3(1.0,0.863,0.682)*a,1.0);
  }`,
  transparent:true,depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending
});
const ring=new THREE.Mesh(new THREE.RingGeometry(200,520,256,1),ringMat);
ring.position.set(0,RING_UP,0);
ring.renderOrder=3;
scene.add(ring);

/* ---------- horizonte de sucesos: SIEMPRE encima, círculo entero ---------- */
const RS=230;
const horizon=new THREE.Mesh(new THREE.SphereGeometry(RS,96,64),
  new THREE.MeshBasicMaterial({color:0x000000,depthTest:false,depthWrite:false,transparent:true,opacity:1}));
horizon.renderOrder=10;
scene.add(horizon);

/* ---------- puntos de los callouts (en mundo) ---------- */
disk.updateMatrixWorld(true);
const anchors=[
  disk.localToWorld(new THREE.Vector3(30,-900,0)),                 // disco, lado derecho-cercano, bajo la esfera
  new THREE.Vector3(-RS*Math.SQRT1_2,RS*Math.SQRT1_2,0),           // borde sup-izq del horizonte
  new THREE.Vector3(0,0,0)                                          // singularidad
];
const CALL_T=[0.75,1.00,1.25];
const cards=[0,1,2].map(i=>document.getElementById('c'+i));
const dots=[0,1,2].map(i=>document.getElementById('d'+i));
const lines=[0,1,2].map(i=>document.getElementById('l'+i));
const CARD_TOP=[1170,810,985], CARD_LEFT=600;

/* ---------- headline ---------- */
const TEXT='Ni la luz escapa.', KW0=6, KW1=9; // "luz" = índices 6..8
const hl=document.getElementById('headline');
const chars=[];
let kwBox=null;
for(let i=0;i<TEXT.length;i++){
  if(i===KW0){kwBox=document.createElement('span');kwBox.id='kw';hl.appendChild(kwBox);}
  const s=document.createElement('span');s.className='ch';s.textContent=TEXT[i];
  (i>=KW0&&i<KW1?kwBox:hl).appendChild(s);chars.push(s);
}
const TYPE0=0.30, TYPE1=0.70;
const charTime=i=>TYPE0+(i+1)/TEXT.length*(TYPE1-TYPE0);

/* ---------- setTime ---------- */
const v=new THREE.Vector3();
function toScreen(p){v.copy(p).project(camera);return[(v.x+1)/2*W,(1-v.y)/2*H];}

function setTime(t){
  t=clamp(+t||0,0,DURATION);
  // cámara: push-in suave del 6 %
  const zoom=1+0.06*easeInOut(t/DURATION);
  camera.position.z=F/zoom;
  camera.updateMatrixWorld(true);

  diskMat.uniforms.uT.value=t;
  const pulse=Math.sin(t*Math.PI*2/1.3);
  ring.scale.setScalar(1+0.022*pulse);
  ringMat.uniforms.uI.value=1+0.10*pulse;

  // headline tipeado
  for(let i=0;i<chars.length;i++) chars[i].classList.toggle('on',t>=charTime(i)-1e-6);
  const tk=charTime(KW0);
  if(t>=tk-1e-6){
    const p=clamp((t-tk)/0.12,0,1);
    kwBox.style.visibility='visible';
    kwBox.style.transform=`scale(${0.85+0.15*easeOutCubic(p)})`;
  }else{kwBox.style.visibility='hidden';kwBox.style.transform='scale(0.85)';}

  // callouts: fade + 20px desde la derecha en 200 ms
  for(let i=0;i<3;i++){
    const p=clamp((t-CALL_T[i])/0.2,0,1), e=easeOutCubic(p), dx=20*(1-e);
    cards[i].style.opacity=e.toFixed(4);
    cards[i].style.transform=`translateX(${dx.toFixed(2)}px)`;
    const [sx,sy]=toScreen(anchors[i]);
    dots[i].style.left=sx.toFixed(2)+'px';dots[i].style.top=sy.toFixed(2)+'px';
    dots[i].style.opacity=e.toFixed(4);
    const L=lines[i];
    L.setAttribute('x1',(CARD_LEFT+dx).toFixed(2));L.setAttribute('y1',CARD_TOP[i]+50);
    L.setAttribute('x2',sx.toFixed(2));L.setAttribute('y2',sy.toFixed(2));
    L.style.opacity=e.toFixed(4);
  }
  renderer.render(scene,camera);
}
window.setTime=setTime;

/* ---------- arranque ---------- */
setTime(0);
await document.fonts.ready;
await Promise.all(['700 64px Inter','700 30px Inter','400 25px "JetBrains Mono"','italic 500 40px "Cormorant Garamond"']
  .map(f=>document.fonts.load(f).catch(()=>{})));
setTime(0);
window.sceneReady=true;

if(!new URLSearchParams(location.search).has('capture')){
  const loop=ms=>{setTime((ms/1000)%DURATION);requestAnimationFrame(loop);};
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
