// ---------- PRNG determinista ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand = mulberry32(20261114);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=(a,b,x)=>{const u=clamp((x-a)/(b-a),0,1);return u*u*(3-2*u);};
const easeOutBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};

// value noise 2D (seeded, periodic in x)
function makeNoise(seed){
  const r=mulberry32(seed); const N=256; const p=new Float32Array(N*N);
  for(let i=0;i<N*N;i++)p[i]=r();
  const g=(x,y)=>p[((y%N+N)%N)*N+((x%N+N)%N)];
  return function(x,y,period){
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const P=period||N;
    const x0=((xi%P)+P)%P,x1=(((xi+1)%P)+P)%P;
    const a=g(x0,yi),b=g(x1,yi),c=g(x0,yi+1),d=g(x1,yi+1);
    return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
  };
}
const noise=makeNoise(7);
function fbm(x,y,oct,period){let s=0,a=0.5,f=1,n=0;for(let i=0;i<oct;i++){s+=a*noise(x*f,y*f,period?period*f:0);n+=a;a*=0.5;f*=2;}return s/n;}

// Tierra caricatura
function earthTextures(){
  const W=512,H=256;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const img=x.createImageData(W,H);
  const cc=document.createElement('canvas');cc.width=W;cc.height=H;const xc=cc.getContext('2d');
  const ci=xc.createImageData(W,H);
  for(let j=0;j<H;j++){
    const lat=(j/H-0.5)*Math.PI;
    for(let i=0;i<W;i++){
      const u=i/W*8, v=j/H*4;
      let n=fbm(u,v,4,8);
      n+= -0.10*Math.pow(Math.abs(Math.sin(lat)),3);
      const k=(j*W+i)*4;
      let r,g,b;
      if(n>0.53){ // tierra
        const e=smooth(0.53,0.6,n);
        r=70+20*(1-e); g=178+20*(1-e); b=88;
        if(n<0.545){r=60;g=150;b=78;}
      } else {
        const d=smooth(0.3,0.53,n);
        r=36+20*d; g=110+40*d; b=214+20*d;
      }
      if(Math.abs(lat)>1.25){r=236;g=244;b=250;}
      img.data[k]=r;img.data[k+1]=g;img.data[k+2]=b;img.data[k+3]=255;
      // nubes
      const cn=fbm(u*1.625+31,v*2.2+11,4,13);
      let ca=smooth(0.56,0.66,cn);
      ci.data[k]=255;ci.data[k+1]=255;ci.data[k+2]=255;ci.data[k+3]=Math.round(ca*235);
    }
  }
  x.putImageData(img,0,0); xc.putImageData(ci,0,0);
  const t1=new THREE.CanvasTexture(c);t1.colorSpace=THREE.SRGBColorSpace;t1.anisotropy=4;
  const t2=new THREE.CanvasTexture(cc);t2.colorSpace=THREE.SRGBColorSpace;
  return [t1,t2];
}

// suelo lunar: esfera grande (R) parametrizada en un parche
const R=55;
const craters=[];
{
  const want=26;let tries=0;
  while(craters.length<want&&tries<2000){
    tries++;
    const z=0.6+Math.pow(rand(),0.8)*16;
    const halfW=(L0-z)*0.151+1.5;
    const x=(rand()*2-1)*halfW;
    if(Math.abs(x)<1.8&&z<2.2)continue;
    const r=0.35+rand()*rand()*1.9;
    craters.push({x,z,r,d:r*(0.10+rand()*0.08)});
  }
}
function groundH(x,z){
  let h=-(x*x+z*z)/(2*R);
  h+=(fbm(x*0.35+50,z*0.35+20,3)-0.5)*0.35;
  for(const c of craters){
    const dx=x-c.x,dz=z-c.z;const d=Math.sqrt(dx*dx+dz*dz)/c.r;
    if(d<1.6){
      if(d<1)h-=c.d*(1-d*d);
      h+=c.d*0.45*Math.exp(-Math.pow((d-1)/0.22,2));
    }
  }
  // zona plana bajo el astronauta
  const fz=Math.exp(-(x*x+z*z)/2.2);
  return h*(1-fz)+(-(x*x+z*z)/(2*R))*fz;
}
{
  const NX=300,NZ=320,X0=-15,X1=15,Z0=-6,Z1=21;
  const g=new THREE.PlaneGeometry(1,1,NX,NZ);
  const pos=g.attributes.position;const col=new Float32Array(pos.count*3);
  const cNear=new THREE.Color('#8d8d92'),cFar=new THREE.Color('#c9c9cc'),tmp=new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const u=pos.getX(i)+0.5,v=pos.getY(i)+0.5;
    const x=X0+(X1-X0)*u,z=Z0+(Z1-Z0)*(1-v);
    pos.setXYZ(i,x,groundH(x,z),z);

}

const DUST=170,T0=1.05,GRAV=4.3;

  vertexShader:`attribute float aA;attribute float aS;uniform float uScale;varying float vA;
    void main(){vec4 mv=modelViewMatrix*vec4(position,1.0);vA=aA;gl_PointSize=max(1.5,aS*uScale/-mv.z);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying float vA;void main(){float r=length(gl_PointCoord-0.5);float a=smoothstep(0.5,0.1,r)*vA;if(a<0.003)discard;gl_FragColor=vec4(0.86,0.86,0.88,a);}`
});
const dust=new THREE.Points(dustGeo,dustMat);dust.frustumCulled=false;astroScene.add(dust);

// ---------- Headline ----------
const HL_PRE='Gravedad: ',HL_KEY='1/6',HL_POST=' de la terrestre.';
const hl=document.getElementById('headline');
const chars=[];let boxEl,keyStart;
function addChars(parent,s){for(const c of s){const sp=document.createElement('span');sp.className='ch';sp.textContent=c;parent.appendChild(sp);chars.push(sp);}}
addChars(hl,HL_PRE);
boxEl=document.createElement('span');boxEl.className='box';hl.appendChild(boxEl);
keyStart=chars.length;addChars(boxEl,HL_KEY);
addChars(hl,HL_POST);
const TYPE0=0.40,TYPE1=1.00,NCH=chars.length;
const charTime=i=>TYPE0+(i/NCH)*(TYPE1-TYPE0);

// ---------- Animación ----------
const H=2.8,TA=2.2,TF=TA-T0;
function jumpY(t){if(t<T0)return 0;const u=(t-TA)/TF;return H*(1-u*u);}

window.setTime=function(t){
  t=clamp(t,0,DURATION);
  // cámara: dolly-in 5%
  const p=t/DURATION;
  cam.position.set(0,0.04,L0/(1+0.05*p));
  cam.updateMatrixWorld();

  // agachado y recogido
  const crouch=t<T0?smooth(0.85,1.05,t):1-smooth(T0,1.2,t);
  const tuck=smooth(1.3,1.95,t);
  const aC=0.6*crouch, aT=0.55*tuck;
  const a=aC+aT;
  [legL,legR].forEach((lg,i)=>{
    const s=i?1:-1;
    lg.hip.rotation.x=-a; lg.kn.rotation.x=2*a; lg.ank.rotation.x=-a;
    lg.hip.rotation.z=s*0.04*tuck;
  });
  const drop=1.75*(1-Math.cos(aC));
  const breath=Math.sin(t*Math.PI*2/1.4);
  body.position.y=-drop;
  torsoG.scale.y=1+0.012*breath*(1-smooth(0.8,1.0,t));
  torsoG.rotation.x=0.12*crouch-0.03*tuck;
  head.position.y=2.95+0.015*breath*(1-smooth(0.8,1.0,t));
  head.rotation.x=-0.05*crouch+0.06*smooth(1.1,1.6,t);
  astro.position.y=jumpY(t); // en vuelo el torso sigue la parábola y los pies suben al recoger

  // brazos
  const up=smooth(1.0,1.4,t);
  const wave=t>1.3?Math.sin((t-1.3)*5.2)*smooth(1.3,1.6,t):0;
  const wave2=t>1.3?Math.sin((t-1.3)*5.2+1.2)*smooth(1.3,1.6,t):0;
  const restZ=0.22+0.02*breath;
  const swing=crouch*(t<T0?1:0);
  const zL=-(restZ+(2.45-restZ)*up)-0.14*wave;
  const zR=(restZ+(2.45-restZ)*up)+0.14*wave2;
  armL.sh.rotation.set(0.45*swing*(1-up)+0.2*up,0,zL);
  armR.sh.rotation.set(0.45*swing*(1-up)+0.2*up,0,zR);
  armL.el.rotation.set(0,0,-0.15-0.25*up*(0.5+0.5*wave2)-0.1*crouch);
  armR.el.rotation.set(0,0,0.15+0.25*up*(0.5+0.5*wave)+0.1*crouch);

  // sombra
  const y=astro.position.y;
  const sk=1/(1+y*0.32);
  shadow.scale.set(2.1*sk,0.36*sk,1);
  shadow.material.opacity=0.62*(0.25+0.75*(1-y/H))*sk+0.0;

  // polvo
  const dt=t-T0;
  for(let i=0;i<DUST;i++){
    const tt=dt-dD[i];
    if(tt<=0){dustA[i]=0;dustPos[i*3+1]=-10;continue;}
    let px=dP0[i*3]+dV[i*3]*tt, pz=dP0[i*3+2]+dV[i*3+2]*tt;
    let py=dP0[i*3+1]+dV[i*3+1]*tt-0.5*GRAV*tt*tt;
    const gy=-(px*px+pz*pz)/(2*R)+0.02;
    if(py<gy){ // ya tocó el suelo: se queda donde cayó
      const tl=(dV[i*3+1]+Math.sqrt(dV[i*3+1]*dV[i*3+1]+2*GRAV*Math.max(0,dP0[i*3+1]-gy)))/GRAV;
      px=dP0[i*3]+dV[i*3]*tl;pz=dP0[i*3+2]+dV[i*3+2]*tl;py=gy;
    }
    dustPos[i*3]=px;dustPos[i*3+1]=py;dustPos[i*3+2]=pz;
    dustA[i]=0.75*smooth(0,0.05,tt)*(1-smooth(dL[i]*0.4,dL[i],tt));
  }
  dustGeo.attributes.position.needsUpdate=true;dustGeo.attributes.aA.needsUpdate=true;

  // fondo
  starMat.uniforms.uTime.value=t;
  earthBody.rotation.y=0.6+t*0.22;
  earthClouds.rotation.y=0.6+t*0.27;

  // headline
  for(let i=0;i<NCH;i++)chars[i].style.visibility=(t>=charTime(i))?'visible':'hidden';
  const tk=charTime(keyStart);
  if(t>=tk){
    const u=clamp((t-tk)/0.12,0,1);
    boxEl.style.visibility='visible';
    boxEl.style.transform=`scale(${(0.85+0.15*easeOutBack(u)).toFixed(4)})`;
  }else{boxEl.style.visibility='hidden';boxEl.style.transform='scale(0.85)';}

  // render
  renderer.clear();
  renderer.render(bgScene,orthoCam);
  renderer.clearDepth();
  renderer.render(groundScene,cam);
  renderer.clearDepth();
  renderer.render(astroScene,cam);
};

await document.fonts.ready;
await Promise.all([
  document.fonts.load('700 64px Inter'),document.fonts.load('700 40px Inter'),
  document.fonts.load('italic 500 40px "Cormorant Garamond"')
]);
renderer.compile(bgScene,orthoCam);renderer.compile(groundScene,cam);renderer.compile(astroScene,cam);
window.setTime(0);
window.sceneReady=true;

if(!new URLSearchParams(location.search).has('capture')){
  let start=null;
  const loop=ms=>{if(start===null)start=ms;window.setTime(((ms-start)/1000)%DURATION);requestAnimationFrame(loop);};
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
