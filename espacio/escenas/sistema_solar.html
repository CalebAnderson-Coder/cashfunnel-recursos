{ "imports": {

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="overlay">
  <div id="band"></div>
  <div id="headline"></div>
  <div id="ltitle">explicador del sistema solar</div>

<script type="module">
import * as THREE from 'three';

const DURATION = 2.7;
window.DURATION = DURATION;
window.sceneReady = false;

const W = 1080, H = 1920, CX = 540, CY = 965;
const DEG = Math.PI / 180;

// ---------- PRNG + ruido con semilla ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeNoise(seed){
  const r = mulberry32(seed);
  const perm = new Uint16Array(512), val = new Float32Array(256);
  const p = []; for(let i=0;i<256;i++){p.push(i); val[i]=r();}
  for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1)); const t=p[i]; p[i]=p[j]; p[j]=t;}
  for(let i=0;i<512;i++) perm[i]=p[i&255];
  const fade = t=>t*t*(3-2*t);
  const h = (x,y,z)=>val[perm[perm[perm[x&255]+(y&255)]+(z&255)]];
  function n3(x,y,z){
    const X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z);
    const fx=fade(x-X),fy=fade(y-Y),fz=fade(z-Z);
    const l=(a,b,t)=>a+(b-a)*t;
    return l(
      l(l(h(X,Y,Z),h(X+1,Y,Z),fx), l(h(X,Y+1,Z),h(X+1,Y+1,Z),fx), fy),
      l(l(h(X,Y,Z+1),h(X+1,Y,Z+1),fx), l(h(X,Y+1,Z+1),h(X+1,Y+1,Z+1),fx), fy), fz);
  }
  function fbm(x,y,z,oct=5){let s=0,a=0.5,f=1,n=0;for(let i=0;i<oct;i++){s+=a*n3(x*f+i*17.3,y*f+i*9.1,z*f+i*3.7);n+=a;a*=0.5;f*=2.03;}return s/n;}
  return {n3,fbm};
}
const mix = (a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const sstep = (e0,e1,x)=>{const t=Math.min(1,Math.max(0,(x-e0)/(e1-e0)));return t*t*(3-2*t);};

// ---------- texturas procedurales equirectangulares ----------
function planetTexture(seed, fn, w=512, h=256){
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx=cv.getContext('2d'); const img=ctx.createImageData(w,h); const d=img.data;
  const N=makeNoise(seed);
  for(let j=0;j<h;j++){
    const lat=(0.5-(j+0.5)/h)*Math.PI, cl=Math.cos(lat), y=Math.sin(lat);
    for(let i=0;i<w;i++){
      const lon=(i+0.5)/w*Math.PI*2;
      const x=cl*Math.cos(lon), z=cl*Math.sin(lon);
      const c=fn(x,y,z,lat/(Math.PI/2),lon,N);
      const k=(j*w+i)*4;
      d[k]=Math.max(0,Math.min(255,c[0])); d[k+1]=Math.max(0,Math.min(255,c[1])); d[k+2]=Math.max(0,Math.min(255,c[2])); d[k+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  const tex=new THREE.CanvasTexture(cv);
  tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=4;
  return tex;
}

const TEX = {
  mercurio:(x,y,z,la,lo,N)=>{
    const n=N.fbm(x*3,y*3,z*3,5);
    const cr=N.fbm(x*9+5,y*9,z*9,3);
    let c=mix([95,92,90],[175,170,165],n);
    c=mix(c,[70,68,66],sstep(0.62,0.70,cr)*0.7);
    c=mix(c,[200,196,190],sstep(0.70,0.74,cr)*0.4);
    return c;
  },
  venus:(x,y,z,la,lo,N)=>{
    const w=N.fbm(x*2.5,y*2.5,z*2.5,4);
    const b=Math.sin((la+0.25*w)*9.0)*0.5+0.5;
    return mix(mix([214,188,140],[244,228,190],b),[255,240,210],N.fbm(x*6,y*6,z*6,3)*0.35);
  },
  tierra:(x,y,z,la,lo,N)=>{
    const land=N.fbm(x*1.8+3,y*1.8,z*1.8,6);
    const deep=N.fbm(x*4,y*4,z*4,3);
    let c=mix([18,62,160],[40,110,210],deep);
    const L=sstep(0.53,0.56,land);
    const veg=mix([66,132,58],[156,136,84],sstep(0.55,0.70,N.fbm(x*5,y*5,z*5,3)+Math.abs(la)*0.15));
    c=mix(c,veg,L);
    c=mix(c,[240,246,250],sstep(0.80,0.88,Math.abs(la)));
    const cl=N.fbm(x*3.5+11,y*5,z*3.5,5);
    c=mix(c,[250,252,255],sstep(0.54,0.68,cl)*0.85);
    return c;
  },
  marte:(x,y,z,la,lo,N)=>{
    const n=N.fbm(x*2.6,y*2.6,z*2.6,5);
    let c=mix([150,58,32],[214,104,58],n);
    c=mix(c,[96,44,30],sstep(0.55,0.66,N.fbm(x*1.6+7,y*1.6,z*1.6,4))*0.75);
    c=mix(c,[245,236,228],sstep(0.86,0.92,Math.abs(la)));
    return c;
  },
  jupiter:(x,y,z,la,lo,N)=>{
    const w=N.fbm(x*3,y*6,z*3,4);
    const v=la+0.07*(w-0.5)*2;
    const s=Math.sin(v*Math.PI*6.5);
    const s2=Math.sin(v*Math.PI*15+1.3);
    let c=mix([170,118,80],[238,220,188],s*0.5+0.5);
    c=mix(c,[206,170,128],(s2*0.5+0.5)*0.35);
    // gran mancha roja
    const dl=(lo-3.9), dla=(la+0.24);
    const e=(dl*dl)/(0.30*0.30)+(dla*dla)/(0.09*0.09);
    c=mix(c,[196,92,62],sstep(1.0,0.45,e));
    c=mix(c,[236,170,130],sstep(1.2,1.0,e)*sstep(0.6,1.0,e)*0.6);
    return c;
  },
  saturno:(x,y,z,la,lo,N)=>{
    const w=N.fbm(x*3,y*7,z*3,3);
    const s=Math.sin((la+0.03*w)*Math.PI*8)*0.5+0.5;
    return mix([196,168,116],[236,216,170],s*0.8+w*0.2);
  },
  urano:(x,y,z,la,lo,N)=>{
    const s=Math.sin(la*Math.PI*5)*0.5+0.5;
    return mix([150,208,218],[192,234,238],s*0.4+N.fbm(x*3,y*6,z*3,3)*0.3);
  },
  neptuno:(x,y,z,la,lo,N)=>{
    const w=N.fbm(x*3,y*7,z*3,4);
    const s=Math.sin((la+0.05*w)*Math.PI*6)*0.5+0.5;
    let c=mix([36,72,190],[78,124,236],s*0.6+w*0.4);
    const dl=lo-2.2, dla=la+0.3; const e=(dl*dl)/0.06+(dla*dla)/0.012;
    c=mix(c,[20,40,120],sstep(1,0.3,e)*0.8);
    return c;
  },
};

// ---------- renderer / escena ----------
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
renderer.setSize(W,H,false);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.setClearColor(0x020203,1);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x020203);

// Cámara ortográfica: 1 unidad = 1 px. Sol en (540, 965).
const camera=new THREE.OrthographicCamera(-CX, W-CX, CY, -(H-CY), 1, 8000);
const ELEV=50*DEG;               // elevación que da la elipse 1100 x ~840 px pedida
const CAM_D=3000;
const CAM_ORBIT=8*DEG;
function placeCamera(t){
  const az=-CAM_ORBIT*(t/DURATION);
  camera.position.set(CAM_D*Math.cos(ELEV)*Math.sin(az), CAM_D*Math.sin(ELEV), CAM_D*Math.cos(ELEV)*Math.cos(az));
  camera.up.set(0,1,0);
  camera.lookAt(0,0,0);
  camera.updateMatrixWorld();
}

// Luces: el Sol ilumina; relleno muy tenue para que el lado oscuro no sea negro puro.
const sunLight=new THREE.PointLight(0xfff1dc, 4.2, 0, 0);
scene.add(sunLight);
scene.add(new THREE.HemisphereLight(0x8fa6ff, 0x1a120c, 0.10));

// ---------- estrellas ----------
function dotTexture(){
  const cv=document.createElement('canvas'); cv.width=cv.height=32;
  const g=cv.getContext('2d'); const gr=g.createRadialGradient(16,16,0,16,16,16);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.45,'rgba(255,255,255,.6)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,32,32);
  const t=new THREE.CanvasTexture(cv); return t;
}
const starTex=dotTexture();
{
  const rnd=mulberry32(20261114);
  const camDir=new THREE.Vector3(0,Math.sin(ELEV),Math.cos(ELEV));
  const right=new THREE.Vector3(1,0,0);
  const up=new THREE.Vector3(0,Math.cos(ELEV),-Math.sin(ELEV));
  const base=camDir.clone().multiplyScalar(-1500);
  for(const [count,size,bri] of [[620,1.7,0.55],[110,2.8,0.8]]){
    const pos=[],col=[];
    for(let i=0;i<count;i++){
      // coordenadas de pantalla relativas al Sol (sx a la derecha, sy hacia abajo), con margen para la órbita de cámara
      const sx=(rnd()-0.5)*1600, sy=(rnd()-0.5)*2400;
      const p=base.clone().addScaledVector(right,sx).addScaledVector(up,-sy);
      pos.push(p.x,p.y,p.z);
      const b=bri*(0.35+0.65*rnd()); const tint=rnd();
      const c=tint<0.15?[0.8,0.88,1]:tint>0.9?[1,0.9,0.78]:[1,1,1];
      col.push(c[0]*b,c[1]*b,c[2]*b);
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
    const m=new THREE.PointsMaterial({size,sizeAttenuation:false,map:starTex,vertexColors:true,transparent:true,
      depthTest:false,depthWrite:false,toneMapped:false,blending:THREE.AdditiveBlending});
    const pts=new THREE.Points(g,m); pts.renderOrder=-10; pts.frustumCulled=false;
    scene.add(pts);
  }
}

// ---------- Sol ----------
const SUN_R=90;
const sunMat=new THREE.ShaderMaterial({
  uniforms:{uTime:{value:0}},
  vertexShader:`
    varying vec3 vObj; varying vec3 vN;
    void main(){ vObj=position; vN=normalize(normalMatrix*normal);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    uniform float uTime; varying vec3 vObj; varying vec3 vN;
    float hash(vec3 p){p=fract(p*0.3183099+0.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
    float noise(vec3 x){vec3 i=floor(x);vec3 f=fract(x);f=f*f*(3.0-2.0*f);
      return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                 mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}
    float fbm(vec3 p){float s=0.0,a=0.5;for(int i=0;i<5;i++){s+=a*noise(p);p=p*2.02+vec3(1.7,9.2,3.1);a*=0.5;}return s;}
    void main(){
      vec3 p=normalize(vObj)*3.2;
      vec3 q=vec3(fbm(p+vec3(0.0,uTime*0.35,0.0)), fbm(p+vec3(5.2,1.3,uTime*0.3)), fbm(p+vec3(2.1,uTime*0.25,7.7)));
      float g=fbm(p*2.6+q*2.2+vec3(uTime*0.45));
      float cells=noise(p*9.0+q*3.0+uTime*0.8);
      float n=clamp(g*0.75+cells*0.35,0.0,1.0);
      vec3 deep=vec3(0.95,0.30,0.035);
      vec3 mid=vec3(1.05,0.58,0.10);
      vec3 hot=vec3(1.20,0.92,0.42);
      vec3 col=mix(deep,mid,smoothstep(0.30,0.55,n));
      col=mix(col,hot,smoothstep(0.55,0.82,n));
      float mu=clamp(vN.z,0.0,1.0);
      col*=0.55+0.55*pow(mu,0.45);
      col+=vec3(0.55,0.18,0.02)*pow(1.0-mu,3.0);
      gl_FragColor=vec4(col*1.15,1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
const sun=new THREE.Mesh(new THREE.SphereGeometry(SUN_R,96,64),sunMat);
scene.add(sun);

function glowTexture(stops){
  const cv=document.createElement('canvas'); cv.width=cv.height=256;
  const g=cv.getContext('2d'); const gr=g.createRadialGradient(128,128,0,128,128,128);
  for(const [o,c] of stops) gr.addColorStop(o,c);
  g.fillStyle=gr; g.fillRect(0,0,256,256);
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const glowOuter=new THREE.Sprite(new THREE.SpriteMaterial({
  map:glowTexture([[0,'rgba(255,140,40,0.55)'],[0.22,'rgba(255,120,30,0.32)'],[0.5,'rgba(230,80,20,0.10)'],[0.75,'rgba(180,50,10,0.03)'],[1,'rgba(0,0,0,0)']]),
  blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,toneMapped:false}));
glowOuter.scale.set(820,820,1); glowOuter.renderOrder=5;
const glowInner=new THREE.Sprite(new THREE.SpriteMaterial({
  map:glowTexture([[0,'rgba(255,210,120,0.0)'],[0.30,'rgba(255,200,110,0.0)'],[0.36,'rgba(255,190,90,0.55)'],[0.55,'rgba(255,140,40,0.22)'],[1,'rgba(0,0,0,0)']]),
  blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,toneMapped:false}));
glowInner.scale.set(500,500,1); glowInner.renderOrder=6;
scene.add(glowOuter,glowInner);

// ---------- planetas ----------
// phi = ángulo en el plano orbital (0 = derecha de pantalla, 90 = abajo/hacia la cámara).
// dphi = avance orbital en toda la duración (interiores más rápido).
const PLANETS=[
  {name:'Mercurio', d:30,  R:145, phi0: 25,  dphi:40, tex:'mercurio', spin:0.4, rough:0.95},
  {name:'Venus',    d:50,  R:190, phi0:200,  dphi:28, tex:'venus',    spin:0.2, rough:0.9},
  {name:'Tierra',   d:56,  R:240, phi0:160,  dphi:22, tex:'tierra',   spin:1.0, rough:0.75, tilt:23},
  {name:'Marte',    d:44,  R:288, phi0:215,  dphi:17, tex:'marte',    spin:0.9, rough:0.95, tilt:25},
  {name:'Júpiter',  d:120, R:358, phi0:120,  dphi:11, tex:'jupiter',  spin:1.6, rough:0.85},
  {name:'Saturno',  d:86,  R:435, phi0: 50,  dphi:9,  tex:'saturno',  spin:1.4, rough:0.85, ring:true},
  {name:'Urano',    d:70,  R:495, phi0:  2,  dphi:7,  tex:'urano',    spin:0.8, rough:0.8, tilt:82},
  {name:'Neptuno',  d:66,  R:548, phi0:-40,  dphi:6,  tex:'neptuno',  spin:0.9, rough:0.8, tilt:28},
];

// Órbitas
const orbitMat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.22,depthWrite:false,toneMapped:false});
for(const p of PLANETS){
  const pts=[]; const S=320;
  for(let i=0;i<S;i++){const a=i/S*Math.PI*2; pts.push(new THREE.Vector3(p.R*Math.cos(a),0,p.R*Math.sin(a)));}
  const line=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),orbitMat);
  line.renderOrder=1;
  scene.add(line);
}

function ringTexture(){
  const cv=document.createElement('canvas'); cv.width=512; cv.height=4;
  const g=cv.getContext('2d'); const N=makeNoise(77);
  for(let i=0;i<512;i++){
    const u=i/511;
    let a=0.55+0.45*N.n3(u*40,0.5,0.5);
    if(u>0.60&&u<0.66) a*=0.18;            // división de Cassini
    a*=sstep(0.0,0.06,u)*sstep(1.0,0.93,u);
    const l=Math.round(196+30*N.n3(u*18,3.3,1.1));
    g.fillStyle=`rgba(${l},${l-6},${l-16},${a.toFixed(3)})`; g.fillRect(i,0,1,4);
  }
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t;
}

const planetObjs=[];
const overlay=document.getElementById('overlay');
for(const p of PLANETS){
  const group=new THREE.Group();
  const tiltG=new THREE.Group(); tiltG.rotation.z=(p.tilt||0)*DEG;
  const map=planetTexture(1000+p.d*7+p.R, TEX[p.tex]);
  const mat=new THREE.MeshStandardMaterial({map,roughness:p.rough,metalness:0});
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(p.d/2,64,48),mat);
  tiltG.add(mesh); group.add(tiltG);
  if(p.ring){
    const inner=p.d/2+11, outer=95;
    const rg=new THREE.RingGeometry(inner,outer,160,1);
    const pa=rg.attributes.position, uv=rg.attributes.uv;
    for(let i=0;i<pa.count;i++){const r=Math.hypot(pa.getX(i),pa.getY(i)); uv.setXY(i,(r-inner)/(outer-inner),0.5);}
    const rt=ringTexture();
    const rm=new THREE.MeshStandardMaterial({map:rt,emissive:0xffffff,emissiveMap:rt,emissiveIntensity:0.28,
      roughness:0.9,metalness:0,side:THREE.DoubleSide,transparent:true,depthWrite:false});
    const ring=new THREE.Mesh(rg,rm);
    ring.rotation.x=-Math.PI/2;
    const ringTilt=new THREE.Group(); ringTilt.rotation.x=-25*DEG; ringTilt.add(ring);
    ring.renderOrder=3;
    group.add(ringTilt);
    tiltG.rotation.x=-25*DEG;
  }
  scene.add(group);
  const label=document.createElement('div'); label.className='plabel'; label.textContent=p.name;
  overlay.appendChild(label);
  planetObjs.push({p,group,mesh,label});
}

// ---------- headline ----------
const HL_PRE='8 planetas, un solo ', HL_KEY='Sol.';
const HL_TOTAL=HL_PRE.length+HL_KEY.length;
const T0=0.25, T1=0.75;
const hl=document.getElementById('headline');
const chars=[];
for(const ch of HL_PRE){const s=document.createElement('span');s.className='ch';s.textContent=ch;hl.appendChild(s);chars.push(s);}
const keyBox=document.createElement('span'); keyBox.className='key'; hl.appendChild(keyBox);
for(const ch of HL_KEY){const s=document.createElement('span');s.className='ch';s.textContent=ch;keyBox.appendChild(s);chars.push(s);}
const T_KEY=T0+(HL_PRE.length/HL_TOTAL)*(T1-T0);

function updateHeadline(t){
  const n = t<T0 ? 0 : Math.min(HL_TOTAL, Math.floor((t-T0)/(T1-T0)*HL_TOTAL+1e-6)+1);
  for(let i=0;i<HL_TOTAL;i++) chars[i].classList.toggle('on', i<n);
  if(n>HL_PRE.length){
    const k=Math.min(1,Math.max(0,(t-T_KEY)/0.12));
    const e=1-Math.pow(1-k,3);
    keyBox.style.visibility='visible';
    keyBox.style.transform=`scale(${(0.85+0.15*e).toFixed(4)})`;
  }else{
    keyBox.style.visibility='hidden';
    keyBox.style.transform='scale(0.85)';
  }
}

// ---------- tiempo determinista ----------
const tmp=new THREE.Vector3();
function setTime(t){
  t=Math.min(DURATION,Math.max(0,+t||0));
  const u=t/DURATION;
  placeCamera(t);
  sunMat.uniforms.uTime.value=t;
  sun.rotation.y=u*0.35;
  for(const o of planetObjs){
    const a=(o.p.phi0-o.p.dphi*u)*DEG;
    o.group.position.set(o.p.R*Math.cos(a),0,o.p.R*Math.sin(a));
    o.mesh.rotation.y=o.p.spin*t+o.p.R*0.01;
    o.group.updateMatrixWorld(true);
    tmp.setFromMatrixPosition(o.group.matrixWorld).project(camera);
    const sx=(tmp.x+1)*W/2, sy=(1-tmp.y)*H/2;
    o.label.style.transform=`translate(${sx.toFixed(2)}px,${(sy-o.p.d/2-10).toFixed(2)}px) translate(-50%,-100%)`;
  }
  updateHeadline(t);
  renderer.render(scene,camera);
}
window.setTime=setTime;

// ---------- arranque ----------
(async()=>{
  try{
    await Promise.all([
      document.fonts.load("600 26px 'Inter'"),document.fonts.load("700 64px 'Inter'"),
      document.fonts.load("700 40px 'Inter'"),document.fonts.load("italic 500 40px 'Cormorant Garamond'"),
    ]);
  }catch(e){}
  await document.fonts.ready;
  renderer.compile(scene,camera);
  setTime(0);
  window.sceneReady=true;
  if(!new URLSearchParams(location.search).has('capture')){
    const loop=ms=>{setTime((ms/1000)%DURATION);requestAnimationFrame(loop);};
    requestAnimationFrame(loop);
  }
})();
</script>
